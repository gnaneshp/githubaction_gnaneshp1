name: simple_workflow
on: [push,workflow_dispatch]
jobs:
  first_job: 
    runs-on: ubuntu-latest
    steps:
      - name: step1-checkout
        uses: actions/checkout@v7
      - name: step2-install dependencies
        run: npm install
      - name: step3-lint
        run: npm run lint
      - name: step4-test
        run: npm test
      - name: step5-deploy
        run: echo "deployed successfully!"
  
    
