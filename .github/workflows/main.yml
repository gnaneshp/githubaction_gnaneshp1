name: simple_workflow
on: 
  pull_request:
    branches: [main]
    types: [opened]
jobs:
  first_job: 
    runs-on: ubuntu-latest
    steps:
      - name: step1-checkout
        uses: actions/checkout@v7
      - name: step2-install dependencies
        run: npm install
      - name: step3-lint
        run: npm run lint
      - name: step4-test
        run: npm run test
      - name: step4-build
        run: npm run build
      - name: step5-deploy
        run: echo "deployed successfully!"
  
    
