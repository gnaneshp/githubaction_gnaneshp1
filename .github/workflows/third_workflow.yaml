name: third_workflow
on: [push,workflow_dispatch]
jobs:
  lint: 
    runs-on: ubuntu-latest
    steps:
      - name: step1-checkout
        uses: actions/checkout@v7
      - name: step2-install dependencies
        run: npm install
      - name: step3-lint
        run: npm run lint
  test: 
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: step1-checkout
        uses: actions/checkout@v7
      - name: step2-install dependencies
        run: npm install
      - name: step4-test
        run: npm run test
  deploy: 
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: step1-checkout
        uses: actions/checkout@v7
      - name: step2-install dependencies
        run: npm install
      - name: step4-build
        run: npm run build
      - name: step5-deploy
        run: echo "deployed successfully!"
  
    
